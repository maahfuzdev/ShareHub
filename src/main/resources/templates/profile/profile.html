<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ShareHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
<nav class="app-nav"><a class="app-brand" th:href="@{/dashboard}"><span>SH</span> ShareHub</a><div class="app-nav-links"><a th:href="@{/dashboard}">Dashboard</a><a class="active" th:href="@{/profile}">Profile</a><button id="logoutBtn" class="nav-logout" type="button">Sign out</button></div></nav>
<main class="page-wrap">
    <div class="page-heading"><div><p class="kicker">Account</p><h1>Your profile</h1><p>Keep your community details clear and up to date.</p></div><a class="back-link" th:href="@{/dashboard}"><i class="bi bi-arrow-left"></i> Dashboard</a></div>
    <section class="profile-layout" th:if="${user}">
        <article class="profile-hero"><div class="profile-avatar" th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">S</div><h2 th:text="${user.name}">ShareHub member</h2><p th:text="${user.email}">email@example.com</p><span class="profile-role" th:text="${user.role}">MEMBER</span></article>
        <article class="details-card"><div class="card-topline"><div><p class="kicker">Personal details</p><h2>About you</h2></div><i class="bi bi-person-vcard"></i></div><dl class="details-list"><div><dt>Full name</dt><dd th:text="${user.name}">Not added</dd></div><div><dt>Email address</dt><dd th:text="${user.email}">Not added</dd></div><div><dt>Phone number</dt><dd th:text="${user.phone ?: 'Not added'}">Not added</dd></div><div><dt>Location</dt><dd th:text="${user.address ?: 'Not added'}">Not added</dd></div></dl></article>
    </section>
</main>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
