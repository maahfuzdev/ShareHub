<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>

<!-- Header Fragment -->
<header th:fragment="header" class="header-fragment">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .header-fragment {
            background: #1a2332;
            padding: 16px 32px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-fragment .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }
        .header-fragment .nav-links a {
            color: #b8c1d1;
            text-decoration: none;
            margin-left: 24px;
            transition: color 0.3s;
        }
        .header-fragment .nav-links a:hover {
            color: #fff;
        }
    </style>

    <a th:href="@{/dashboard}" class="brand">
        <i class="bi bi-share-fill"></i> ShareHub
    </a>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</header>

</body>
</html>
