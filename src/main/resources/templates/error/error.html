<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error | ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }
        .error-box {
            max-width: 500px;
            padding: 40px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            opacity: 0.3;
        }
        .error-message {
            font-size: 1.5rem;
            margin: 20px 0;
            font-weight: 600;
        }
        .btn-home {
            background: #fff;
            color: #764ba2;
            padding: 12px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,255,255,0.3);
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code" th:text="${status ?: '500'}">500</div>
        <div class="error-message" th:text="${error ?: 'Something went wrong'}">Error</div>
        <p th:text="${message ?: 'Please try again later.'}">Message</p>
        <a th:href="@{/dashboard}" class="btn-home">
            <i class="bi bi-house-door"></i> Go Home
        </a>
    </div>
</body>
</html>
