```properties
# =========================================================
# SHAREHUB - APPLICATION CONFIGURATION
# =========================================================


# =========================================================
# APPLICATION
# =========================================================
spring.application.name=sharehub


# =========================================================
# SERVER
# =========================================================
# Render provides PORT automatically.
# Local development uses 8080 if PORT is not set.
server.port=${PORT:8080}

server.servlet.context-path=/


# =========================================================
# SESSION CONFIGURATION
# =========================================================
# Session will remain valid for 30 minutes.
server.servlet.session.timeout=30m

# Custom session cookie name
server.servlet.session.cookie.name=SHAREHUB_SESSION

# Prevent JavaScript from accessing the session cookie
server.servlet.session.cookie.http-only=true

# Local development = false
# Render / Production = true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Cookie max age = 30 minutes
server.servlet.session.cookie.max-age=1800

# Use cookies for session tracking
server.servlet.session.tracking-modes=cookie


# =========================================================
# DATABASE - POSTGRESQL
# =========================================================
# Render uses the environment variables below.
#
# Local development defaults:
# DB_HOST=localhost
# DB_PORT=5432
# DB_NAME=sharehub
# DB_USERNAME=postgres
# DB_PASSWORD=postgres

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sharehub}?currentSchema=public

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=30000


# =========================================================
# JPA / HIBERNATE
# =========================================================
# Hibernate will only validate the existing database schema.
# It will NOT create or modify tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=public

spring.jpa.show-sql=false


# =========================================================
# FLYWAY DATABASE MIGRATION
# =========================================================
spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

spring.flyway.schemas=public

spring.flyway.default-schema=public

spring.flyway.locations=classpath:db/migration


# =========================================================
# LOGGING
# =========================================================
logging.level.com.sharehub=DEBUG

logging.level.org.springframework.security=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
```
