```properties
# src/main/resources/application.properties


# =========================================================
# APPLICATION
# =========================================================
spring.application.name=sharehub


# =========================================================
# SERVER
# =========================================================
# Render provides PORT automatically.
# Local development will use 8080 if PORT is not set.
server.port=${PORT:8080}

server.servlet.context-path=/


# =========================================================
# SESSION CONFIGURATION
# =========================================================
server.servlet.session.timeout=30m

server.servlet.session.cookie.name=SHAREHUB_SESSION

server.servlet.session.cookie.http-only=true

# Local = false
# Render/Production = true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.servlet.session.cookie.max-age=1800

server.servlet.session.tracking-modes=cookie


# =========================================================
# DATABASE
# =========================================================
# Render:
#   DATABASE_URL = Render PostgreSQL Internal Database URL
#
# Local:
#   If DATABASE_URL is not available,
#   localhost PostgreSQL will be used.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sharehub?currentSchema=public}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=30000


# =========================================================
# JPA / HIBERNATE
# =========================================================
# Hibernate will NOT create or modify tables.
# It will only validate the database schema.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=public

spring.jpa.show-sql=false


# =========================================================
# FLYWAY DATABASE MIGRATION
# =========================================================
spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

spring.flyway.schemas=public

spring.flyway.default-schema=public

spring.flyway.locations=classpath:db/migration


# =========================================================
# LOGGING
# =========================================================
logging.level.com.sharehub=DEBUG

logging.level.org.springframework.security=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
```
