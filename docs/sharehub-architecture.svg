<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">ShareHub system architecture</title>
  <desc id="description">Browser and external API clients access a Spring Boot application. Spring Security protects the web and API controllers, which call shared services and Spring Data repositories. PostgreSQL stores application data and Flyway manages its schema.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .app { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .security { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
      .database { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .heading { font: 700 17px Arial, sans-serif; fill: #1e293b; }
      .label { font: 600 15px Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="760" rx="18"/>
  <text class="title" x="48" y="52">ShareHub system architecture</text>
  <text class="subtitle" x="48" y="80">One Spring Boot application serves server-rendered pages and a session-based JSON API.</text>

  <rect class="panel" x="38" y="132" width="220" height="490" rx="14"/>
  <text class="heading" x="62" y="166">Clients</text>
  <rect class="node" x="64" y="208" width="168" height="82" rx="10"/>
  <text class="label" x="148" y="241" text-anchor="middle">Web browser</text>
  <text class="small" x="148" y="264" text-anchor="middle">Thymeleaf pages</text>
  <rect class="node" x="64" y="336" width="168" height="100" rx="10"/>
  <text class="label" x="148" y="369" text-anchor="middle">API client</text>
  <text class="small" x="148" y="393" text-anchor="middle">JSON and session</text>
  <text class="small" x="148" y="413" text-anchor="middle">cookie requests</text>
  <text class="tiny" x="62" y="584">No mobile client included</text>

  <rect class="app" x="300" y="118" width="812" height="526" rx="18"/>
  <text class="heading" x="326" y="153">Spring Boot 3.4.7 application</text>

  <rect class="security" x="348" y="258" width="170" height="116" rx="12"/>
  <text class="label" x="433" y="292" text-anchor="middle">Spring Security</text>
  <text class="small" x="433" y="316" text-anchor="middle">Sessions and roles</text>
  <text class="small" x="433" y="339" text-anchor="middle">BCrypt passwords</text>

  <rect class="node" x="568" y="192" width="208" height="90" rx="12"/>
  <text class="label" x="672" y="225" text-anchor="middle">Web controllers</text>
  <text class="small" x="672" y="249" text-anchor="middle">Spring MVC and Thymeleaf</text>
  <rect class="node" x="568" y="354" width="208" height="90" rx="12"/>
  <text class="label" x="672" y="387" text-anchor="middle">REST controllers</text>
  <text class="small" x="672" y="411" text-anchor="middle">Authentication and donations</text>

  <rect class="node" x="824" y="258" width="144" height="116" rx="12"/>
  <text class="label" x="896" y="294" text-anchor="middle">Services</text>
  <text class="small" x="896" y="319" text-anchor="middle">Auth, donations,</text>
  <text class="small" x="896" y="341" text-anchor="middle">resource requests</text>

  <rect class="node" x="1000" y="258" width="90" height="116" rx="12"/>
  <text class="label" x="1045" y="294" text-anchor="middle">Spring</text>
  <text class="small" x="1045" y="318" text-anchor="middle">Data JPA</text>
  <text class="small" x="1045" y="342" text-anchor="middle">Repositories</text>

  <path class="line" d="M232 249 H348"/>
  <path class="line" d="M232 386 H318 V316 H348"/>
  <path class="line" d="M518 286 H540 V237 H568"/>
  <path class="line" d="M518 346 H540 V399 H568"/>
  <path class="line" d="M776 237 H800 V286 H824"/>
  <path class="line" d="M776 399 H800 V346 H824"/>
  <path class="line" d="M968 316 H1000"/>

  <rect class="panel" x="1150" y="132" width="250" height="490" rx="14"/>
  <text class="heading" x="1174" y="166">Data layer</text>
  <rect class="database" x="1180" y="258" width="190" height="130" rx="12"/>
  <text class="label" x="1275" y="296" text-anchor="middle">PostgreSQL 15</text>
  <text class="small" x="1275" y="322" text-anchor="middle">Users, donations,</text>
  <text class="small" x="1275" y="344" text-anchor="middle">requests, image bytes</text>
  <path class="line" d="M1090 316 H1180"/>
  <rect class="node" x="1180" y="462" width="190" height="76" rx="12"/>
  <text class="label" x="1275" y="493" text-anchor="middle">Flyway migrations</text>
  <text class="small" x="1275" y="516" text-anchor="middle">Versioned SQL schema</text>
  <path class="dashed" d="M1275 462 V410"/>
  <text class="tiny" x="1174" y="584">Docker Compose for local development</text>

  <text class="tiny" x="326" y="608">Shared services keep web and API business rules in one application.</text>
</svg>
